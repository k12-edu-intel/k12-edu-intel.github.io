.pdf"}, {"name": "ORICON NEWS", "url": "https://www.oricon.co.jp/news/2471564/full/"}, {"name": "日本英語検定協会 お知らせ一覧", "url": "https://www.eiken.or.jp/eiken/info/"}]}, {"id": "2026-10-27-jp-03", "title": "全國學力調查中學英語「說話」結果資料公開：示例題正答率僅 25.8%", "summary": "國立教育政策研究所於 2026 年 9 月提供令和 8 年度全國學力・學習狀況調查中學英語「話すこと」（說話）的結果資料。其中公開的一道示例題正答率為 25.8%，無作答率達 17.0%。", "details": "上述數字為資料中個別示例題目的數據，並非整體平均分，引用時需注意；資料標示為「令和 8 年 9 月」，確切發布日「未確認」，此處記為 9 月 1 日。口說能力仍是日本中學英語的明顯弱項，也與文科省推動 AI 練習口說、英檢・民間口說評量需求增加的趨勢相呼應。", "region": "日本", "category": "政策制度", "published_date": "2026-09-01", "added_date": "2026-10-27", "sources": [{"name": "国立教育政策研究所（NIER）資料 PDF", "url": "https://www.nier.go.jp/edsc/edp/_uploads/2026/08/26data_03.pdf"}]}, {"id": "2026-10-27-jp-04", "title": "文科省令和 9 年度概算要求：英語教育強化事業要求 6 億日圓，約 200 所 AI 英語模範校", "summary": "文部科學省 8 月底公布令和 9 年度（2027 年度）概算要求，「小・中・高等學校を通じた英語教育強化事業」要求額 6 億日圓（前年度預算 2 億日圓），其中 4 億日圓用於「AI を活用したグローバル人材育成のための英語教育強化事業」。", "details": "該事業計劃指定約 200 所國公私立模範校，實證教師／ALT 指導與 AI 的有效組合，並委託民間企業擔任事務局（平台）。成果目標：中三達 CEFR A1（英檢 3 級程度）以上、高三達 A2（英檢準 2 級程度）以上的學生比例由令和 7 年度的 54.6%、52.4% 提升至令和 9 年度 60%；高三 B1（英檢 2 級程度）以上由 23.9% 提升至 30%。文科省另設「AI 英語教育」平台網站持續更新資訊（9 月 29 日有更新）。", "region": "日本", "category": "政策制度", "published_date": "2026-08-31", "added_date": "2026-10-27", "sources": [{"name": "文部科学省（初等中等教育局 概算要求主要事項 PDF）", "url": "https://www.mext.go.jp/content/20260831-mxt_kyoiku01-000051893-7.pdf"}, {"name": "文部科学省 令和9年度概算要求 資料一覧", "url": "https://www.mext.go.jp/a_menu/yosan/r01/1420668_00005.html"}, {"name": "文科省 AI英語教育プラットフォーム", "url": "https://ai-eigo.mext.go.jp/news/307/"}]}, {"id": "2026-10-27-jp-05", "title": "英國名校 Gordonstoun 日本分校（和歌山）2027 年 9 月開校，校舍公開、9 月起招生", "summary": "英國寄宿名校 Gordonstoun 的日本校「ゴードンストウン・ジャパン」位於和歌山市梅原，預計 2027 年 9 月開校，8 月 20 日向媒體公開改建中的校舍，2026 年 9 月起開始招生。", "details": "據產經新聞報導：首年招收小六至中三共 4 個年級、定員 200 人，最終規模約 700 人；全寄宿制，年費約 800 萬日圓；以各種學校身分設立，提供 A Level 課程，校長為 Natasha Dangerfield。另報導奈良縣在令和 8 年度預算中編列 1,700 萬日圓用於招攬國際學校，顯示關西地方政府積極爭取國際校進駐。", "region": "日本", "category": "國際學校 , "url": "https://www.coach-international.jp/"}]}, {"id": "2026-10-27-jp-09", "title": "Enuma Japan 推出生成式 AI 英語課程「トド英語アカデミー」", "summary": "Enuma Japan 9 月 16 日發布面向小四至中三的「トド英語アカデミー」，9 月 15 日舉行發表會。產品以 4 位 AI 學習教練與 2 種模式運作，運用生成式 AI 輔助學習。", "details": "首波推出 Level 1–3（Pre A1〜A1 High），Level 4–5 預計 2027 年推出；月費 3,100 日圓。屬低價位 AI 英語 EdTech 產品，與文科省 AI 英語政策方向一致。", "region": "日本", "category": "EdTech與教材", "published_date": "2026-09-16", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（Enuma Japan）", "url": "https://prtimes.jp/main/html/rd/p/000000036.000085949.html"}]}, {"id": "2026-10-27-jp-10", "title": "矢野經濟研究所：2025 年度日本教育產業規模 2 兆 8,705 億日圓，語言學校增長", "summary": "矢野經濟研究所 10 月 22 日發布調查，2025 年度教育產業（15 個領域）市場規模為 2 兆 8,705 億 1,000 萬日圓，年增 0.5%。語言學校・教室呈正成長，補習班・預備校則在地方停滯。", "details": "預測 2026 年度市場規模 2 兆 8,821 億 6,000 萬日圓（+0.4%），語言學校持平。報告亦指出大型業者下市、重組加速（可對照 Hulic 收購 Riso 教育一案）。日經轉載了新聞稿摘要。", "region": "日本", "category": "補習與民間教育市場", "published_date": "2026-10-22", "added_date": "2026-10-27", "sources": [{"name": "矢野経済研究所", "url": "https://www.yano.co.jp/press-release/show/press_id/4210"}, {"name": "日本経済新聞（プレスリリース転載）", "url": "https://www.nikkei.com/article/DGXZRSP714182_S6A021C2000000/"}]}, {"id": "2026-10-27-jp-11", "title": "學校基本調查速報：小學生 565 萬人、中學生 306 萬人皆創新低", "summary": "文科省 8 月 26 日公布令和 8 年度學校基本調查速報，小學生 565 萬 4,461 人（較前年減 15 萬 7,914 人）、中學生 306 萬 31 人，雙雙創歷史新低。", "details": "另一方面大學生達 300 萬 542 人，首度突破 300 萬。少子化持續壓縮 K12 補習及學校市場的生源，業者普遍轉向提高單價（英語、國際教育、個別指導）與併購整合。", "region": "日本", "category": "招生與學生數變化", "published_date": "2026-08-26", "added_date": "2026-10-27", "sources": [{"name": "文部科学省（速報 PDF）", "url": "https://www.mext.go.jp/content/20260826-mxt_chousa01-000050842_01.pdf"}, {"name": "教育新聞", "url": "https://www.kyobun.co.jp/article/2026082604"}]}, {"id": "2026-10-27-jp-12", "title": "Hulic 以 TOB 全面收購 Riso 教育集團（TOMAS、鐵綠會）", "summary": "不動產商 Hulic（ヒューリック）宣布以公開收購（TOB）將 Riso 教育集團（リソー教育，旗下有個別指導 TOMAS、鐵綠會等）納為全資子公司。收購價每股 295 日圓（溢價 41.15%），總額約 248 億 4,100 萬日圓。", "details": "收購期間為 10 月 14 日至 11 月 26 日；Hulic 原已持股 50.87%。此案是日本補習產業「上市公司下市＋重組」潮流的代表，值得追蹤 TOB 結果及後續與 Hulic 不動產（校舍）的協同。", "region": "日本", "category": "投資合作", "published_date": "2026-10-13", "added_date": "2026-10-27", "sources": [{"name": "M&A Online", "url": "https://maonline.jp/news/20261013d"}]}, {"id": "2026-10-27-jp-13", "title": "富士山雜誌服務集團收購 Shane English School 等英語・補習事業", "summary": "富士山マガジンサービス 9 月 7 日公告，子公司富士山アカデミアグループ於 10 月 1 日從 V-net HD（ブイネットHD）取得 Shane English School 事業及「Exam V Academy」補習事業。", "details": "Shane English School 事業 2026 年 3 月期營收 1 億 1,852.9 萬日圓；收購價未公開。相關事業的日文正式名稱以 IR 英文頁為準，日文名稱「未確認」。", "region": "日本", "category": "業者動態", "published_date": "2026-09-07", "added_date": "2026-10-27", "sources": [{"name": "Japan IR（富士山マガジンサービス IR）", "url": "https://japanir.jp/en/company/company-3138/ir/3138-20260907-01_wp_business_update/"}]}, {"id": "2026-10-27-jp-14", "title": "第 9 屆 EDIX 大阪 10 月 13–15 日舉行：改至 10 月預算編列期、移師 Grand Cube 大阪", "summary": "教育綜合展 EDIX 大阪於 10 月 13–15 日在 Grand Cube 大阪（大阪國際會議場）舉行，約 120 家企業參展，講座 30 場以上。本屆起改在 10 月（地方政府編列下年度預算時期）舉辦並更換會場。", "details": "EDIX 下一站為 EDIX 福岡，12 月 2–4 日於 Marine Messe 福岡舉行。對 EdTech 及英語教材業者而言，10 月展期更貼近教育委員會的採購決策週期。", "region": "日本", "category": "展會活動", "published_date": "2026-09-09", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（RX Japan）", "url": "https://prtimes.jp/main/html/rd/p/000002165.000026157.html"}, {"name": "EDIX 大阪 官網", "url": "https://www.edix-expo.jp/osaka/ja-jp.html"}, {"name": "EDIX 官網（各地展會）", "url": "https://www.edix-expo.jp/hub/ja-jp.html"}]}, {"id": "2026-10-27-jp-15", "title": "日本 IB 認定校・候補校達 283 所（截至 2026 年 9 月 30 日）", "summary": "文科省 IB 教育推進聯盟網站更新，截至 2026 年 9 月 30 日國內 IB 認定校・候補校（以課程計）共 283 所：PYP 認定 92／候補 42、MYP 47／13、DP 80／7、CP 1／1。", "details": "IB 機構 8 月 29 日在東京都立國際高中舉辦「DP Forum in 東京」，公告日本 IB World School（認定校）為 146 所，世界第 7 多，其中 80 所導入 DP，且導入 DP 的學校與學生數持續增加。統計口徑不同（以課程計 vs 以學校計），引用時須注意。頁面確切更新日期「未確認」，此處以資料基準日記錄。", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-09-30", "added_date": "2026-10-27", "sources": [{"name": "文科省 IB教育推進コンソーシアム（認定校・候補校）", "url": "https://ibconsortium.mext.go.jp/about-ib/school/"}, {"name": "IB教育推進コンソーシアム（DP Forum 公告）", "url": "https://ibconsortium.mext.go.jp/news/news-6331/"}]}, {"id": "2026-10-27-jp-16", "title": "秋季中高生留學招生活躍：ECC 留學展、Riso 冬季短期遊學、各縣留學展", "summary": "ECC 海外留學中心 LET'S 於 10 月 17 日在大阪本社舉辦免費「秋の留学フェア」，10 所海外學校與機構參加，並設「中高生留學」選擇講座。Riso 教育集團子公司 Plus One 教育亦於 10 月 13 日起招募小中高生冬季帶隊短期遊學（矽谷名校體驗 8 日等）。", "details": "千葉縣等地方政府也舉辦中學・高中生留學展（千葉 11 月 7 日）。顯示疫後中高生短期海外研修需求延續，民間業者以「帶隊＋寄宿家庭」產品主打首次出國家庭。", "region": "日本", "category": "留學與海外研修", "published_date": "2026-10-07", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（ECC）", "url": "https://prtimes.jp/main/html/rd/p/000000220.000016929.html"}, {"name": "財経新聞（リソー教育グループ プレスリリース）", "url": "https://www.zaikei.co.jp/releases/3660577/"}, {"name": "千葉県（中学生・高校生留学フェア）", "url": "https://www.pref.chiba.lg.jp/kyouiku/seisaku/press/2026/r8-ryuugaku.html"}]}, {"id": "2026-10-27-hk-01", "title": "2026 施政報告教育重點：AI 學習平台、鼓勵公營學校合併、加強英語說話", "summary": "行政長官 9 月 16 日發表 2026 年施政報告，教育方面包括推出免費 AI 大模型學習資源平台、把 AI 教學助手擴展至更多科目，以及在 2026/27 學年推出「匯流·提升—卓越學校計劃」鼓勵公營中小學合併。", "details": "報告亦提出全港英語說話活動、推動初中學習其他語言、推行教師執業證書等。教育局局長 10 月 2 日向立法會事務委員會簡介相關措施，教育局亦提交了委員會文件。", "region": "香港", "category": "政策制度", "published_date": "2026-09-16", "added_date": "2026-10-27", "sources": [{"name": "2026 施政報告（第七章）", "url": "https://www.policyaddress.gov.hk/2026/en/chapter7.html"}, {"name": "政府新聞公報（施政報告全文）", "url": "https://www.info.gov.hk/gia/general/202609/16/P2026091600269.htm"}, {"name": "教育局（立法會事務委員會文件 PDF）", "url": "https://www.edb.gov.hk/attachment/en/about-edb/press/legco/policy-address/2026_panel%20paper(Eng).pdf"}, {"name": "政府新聞公報（局長立法會簡介）", "url": "https://www.info.gov.hk/gia/general/202610/02/P2026100200378p.htm"}]}, {"id": "2026-10-27-hk-02", "title": "直資學校擴展計劃：48 校獲批，持學生簽證非本地生增 13%", "summary": "教育局 10 月 21 日「局中人語」指出，直資學校擴展計劃已有 48 所直資學校獲批。9 月以自資模式入讀、持學生簽證的非本地學生有 170 人，按年增加 13%。", "details": "另有 7 所學校新取 -hong-kong-opens-british-school-september-2026/"}]}, {"id": "2026-10-27-hk-08", "title": "Kellett School 九龍灣 Sixth Form 中心正式啟用", "summary": "Kellett School 位於九龍灣 The Bay Hub 的 Sixth Form Centre 正式啟用，可容納 240 名 Year 12–13 學生，由英國駐港總領事 Brian Davidson 主持開幕。", "details": "同期香港多所國際學校擴建高年級學額（如 NAIS 紅磡 Sixth Form、Shrewsbury 新增 Y7 等，見 StarSchools 整理）。", "region": "香港", "category": "業者動態", "published_date": "2026-09-11", "added_date": "2026-10-27", "sources": [{"name": "Kellett School", "url": "https://www.kellettschool.com/news/2026-09-11/kellett-opens-new-sixth-form-centre"}, {"name": "British Schools Asia", "url": "https://britishschoolsasia.com/news/2026-08-21-kellett-school-hong-kong-sixth-form-bay-hub-2026/"}, {"name": "StarSchools（國際學校變動整理）", "url": "https://starschools.hk/en/schools/change/international"}]}, {"id": "2026-10-27-hk-09", "title": "語常會成立 30 周年：展示幼兒中英文發展計劃與 AI 語文教學", "summary": "語文教育及研究常務委員會（語常會）10 月 23 日舉行 30 周年誌慶典禮，主題「深耕三十載．語你譜新篇」，近 600 人出席。", "details": "署理教育局局長施俊輝、語常會主席陳黃麗娟出席。活動展示幼兒中英文發展計劃，並提及「人工智能在語文學與教的應用」國際高峰會，顯示「兩文三語」政策正結合 AI 推進。", "region": "香港", "category": "政策制度", "published_date": "2026-10-23", "added_date": "2026-10-27", "sources": [{"name": "政府新聞公報（中文）", "url": "https://www.info.gov.hk/gia/general/202610/23/P2026102300428.htm"}, {"name": "政府新聞公報（English）", "url": "https://www.info.gov.hk/gia/general/202610/23/P2026102300472.htm"}]}, {"id": "2026-10-27-hk-10", "title": "香港卓越獎學金計劃接受 2027/28 海外升學申請", "summary": "香港卓越獎學金計劃 10 月 13 日起至 12 月 31 日接受申請，資助學生 2027/28 學年到海外頂尖大學升學。", "details": "獎學金學費上限每年 30 萬港元，另設經濟審查助學金每年最高 20 萬港元；得獎者畢業後須回港工作至少 2 年。", "region": "香港", "category": "留學與海外研修", "published_date": "2026-10-13", "added_date": "2026-10-27", "sources": [{"name": "政府新聞公報", "url": "https://www.info.gov.hk/gia/general/202610/13/P2026101300146.htm"}, {"name": "香港卓越獎學金計劃", "url": "https://hkses.edb.gov.hk/en/"}]}, {"id": "2026-10-27-hk-11", "title": "The Standard 國際學校展 2026 落幕", "summary": "《英文虎報》（The Standard）主辦的 International Schools Fair 2026 已舉行（報 : [{"name": "British Council Hong Kong（IELTS 日期與費用）", "url": "https://www.britishcouncil.hk/en/exam/ielts/dates-fees-locations"}]}, {"id": "2026-10-27-hk-15", "title": "補習平台報告：SEN 補習需求一年增 58%", "summary": "補習配對平台尋補（Tutor Circle）8 月發表 2026 年度報告，SEN（特殊教育需要）補習請求由 2024 年 85 宗增至 2025 年 135 宗，增幅 58%，並附上門補習收費參考。", "details": "另一平台 TutorZone 9 月 19 日發表香港補習搜尋趨勢報告。兩者均為業者自身平台數據，樣本有限，僅供參考趨勢。", "region": "香港", "category": "補習與民間教育市場", "published_date": "2026-08-13", "added_date": "2026-10-27", "sources": [{"name": "經濟日報（聯合新聞網轉載）", "url": "https://money.udn.com/money/story/123828/9688910"}, {"name": "TutorZone 搜尋趨勢報告", "url": "https://www.tutorzone.com.hk/hk-tutoring-search-trend-report-2026/"}]}, {"id": "2026-10-27-hk-16", "title": "香港體育學院與維多利亞上海學院簽 MOU：精英運動員全額獎學金與彈性 IB", "summary": "香港體育學院（HKSI）10 月 12 日與維多利亞上海學院（VSA）簽署合作備忘錄，VSA 成為其第三所夥伴學校。", "details": "合作提供全額運動獎學金，IB 文憑課程可延長至三年完成，2027/28 學年入學，2027 年初開放申請。屬國際課程學校與公共體育機構的合作案例。", "region": "香港", "category": "投資合作", "published_date": "2026-10-12", "added_date": "2026-10-27", "sources": [{"name": "香港體育學院", "url": "https://www.hksi.org.hk/news/hong-kong-sports-institute-and-victoria-shanghai-academy-sign-mou-to-empower-hong-kong-s-student-athletes-delivering-an-unparalleled-world-class-and-diverse-educational-experience-with-full-scholarships-and-flexible-ib-pathways/"}]}, {"id": "2026-10-28-jp-01", "title": "關西外國語大學與英國名校 Brighton College 提携，2028 年 9 月於枚方市開設大阪首間英式國際學校「Brighton College Kansai Gaidai」", "summary": "關西外國語大學於 10 月 21 日與英國 Brighton College 簽署提携協定，將在大阪府枚方市開設大阪府首間英式國際學校，也是 Brighton College 在日本的首間提携校。預備學校（1–6 年級，定員 432 人）目標 2028 年 9 月開校，高年級（7–13 年級，定員 672 人）預定 2029 年 9 月開校。", "details": "據關西外大新聞稿，預備學校設於中宮校區 ICC（24 人×3 班×6 學年），高年級部設於學研都市校區（24 人×4 班×7 學年），高年級部開校時間有可能延至 2030 年 9 月。朝日新聞報導指，預備學校將推動 STEAM 教育與簡報能力培養，高年級部提供升讀世界頂尖大學的課程。", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-10-22", "added_date": "2026-10-28", "sources": [{"name": "PR TIMES（關西外國語大學新聞稿）", "url": "https://prtimes.jp/main/html/rd/p/000000146.000151397.html"}, {"name": "朝日新聞", "url": "https://www.asahi.com/articles/ASVBP4F8VVBPPTIL01LM.html"}, {"name": "リセマム", "url": "https://resemom.jp/article/2026/10/23/88026.html"}]}, {"id": "2026-10-28-jp-02", "title": "英檢協會宣布「英檢 4 級・5 級挑戰活動」於 2026 年度第 3 回後結束（英検4級・5級チャレンジキャンペーン）", "summary": "日本英語檢定協會於 10 月 23 日宣布，準會場 4・5 級落榜可免費重考兩次的「英檢 4 級・5 級挑戰活動」將於 2026 年度第 3 回檢定後結束。該活動自 2023 年度開辦以來累計約 18 萬人次使用，協會認為已達成一定目的。", "details": "據リセマム報導，結束後，於 2026 年度第 3 回前在準會場正常（付費）應考且落榜者（缺席除外），仍可於其後兩回免費重考；2027 年度第 1 回起正常應考者不再適用。同期英檢第 2 回一次試驗合否結果已於 10 月 26 日開放查閱，二次試驗為 11 月 8 日及 15 日。", "region": "日本", "category": "英語檢定", "published_date": "2026-10-23", "added_date": "2026-10-28", "sources": [{"name": "日本英語検定協会", "url": "https://www.eiken.or.jp/eiken/info/"}, {"name": "リセマム", "url": "https://resemom.jp/article/2026/10/27/88052.html"}]}, {"id": "2026-10-28-jp-03", "title": "JET 計畫創設 40 周年：總務省・外務省・文科省 11 月 2 日舉行紀念典禮", "summary": "文部科學省於 10 月 26 日公布（與總務省、外務省同步發表），將於 11 月 2 日在東京飯店 Grand Arc 半藏門舉行「JET 計畫（語學指導等外國青年招致事業）40 周年紀念典禮及紀念酒會」。JET 計畫於 1987 年（昭和 62 年）創設，是日本學校 ALT（外語指導助手）的主要來源之一。", "details": "紀念典禮 15:00–17:30，內容包括主辦方及駐日大使致辭、現役與前 JET 參加者代表「JET 宣言」、紀念演講、活動成果報告及攝影比賽頒獎；紀念酒會 18:00–19:30。主辦為總務省、外務省、文部科學省及一般財團法人自治體國際化協會（CLAIR）。", "region": "日本", "category": "展會活動", "published_date": "2026-10-26", "added_date": "2026-10-28", "sources": [{"name": "文部科学省", "url": "https://www.mext.go.jp/b_menu/houdou/2026/mext_01693.html"}, {"name": "総務省", "url": "https://www.soumu.go.jp/menu_news/s-news/01gyosei05_02000256.html"}]}, {"id": "2026-10-28-jp-04", "title": "Bizmates 收購 With The World，進軍中小學國際協作學習（ビズメイツ、With The World を子会社化）", "summary": "線上商務英語會話 Bizmates（東證 Growth：9345）於 10 月 16 日取得 With The World 90.7% 股權並納為子公司，預定 10 月 30 日以簡易股份交換完成全資子公司化。With The World 擁有全球 67 國、500 所以上學校網絡，為日本小學至大學提供線上國際交流課與海外研修。", "details": "據新聞稿，With The World 2018 年於神戶創業，年服務約 2 萬人以上，2026 年度獲文科省「EDU-Port ニッポン」應援項目採選。雙方將探討結合學校・自治體與企業客戶網絡的國際協作學習、企業研修與學生共同解決社會課題，以及強化菲律賓海外研修。", "region": "日本", "category": "投資合作", "published_date": "2026-10-19", "added_date": "2026-10-28", "sources": [{"name": "PR TIMES（ビズメイツ新聞稿）", "url": "https://prtimes.jp/main/html/rd/p/000000213.000006561.html"}]}, {"id": "2026-10-28-jp-05", "title": "Aoba Japan International School 杉並新校區 2027 年 8 月開設：與 MIST 共用中等部校舍（アオバジャパン・インター杉並キャンパス）", "summary": "Aoba-BBT 旗下 AIES 宣布在東京都杉並區開設 A-JIS 與武藏國際學校東京（MIST）的中等教育共同校區，預定 2027 年 8 月啟用。新校區延床面積約 5,000㎡、地上 4 層、定員約 500 名，理由是國際教育需求強勁、現有校區在籍人數持續增加。", "details": "A-JIS 將把分散於光が丘、文京校區的 Grade 6–10 整合為 5 年一貫的 IB MYP；MIST 則遷入中等部及高中部（Sixth Form，Cambridge IGCSE／A Level）。AIES 董事會於 9 月 25 日決議簽署協定，預定 2027 年初簽訂租約、2 月起內裝工程。光が丘校區其後將專供幼稚部與初等部（PYP）。", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-10-05", "added_date": "2026-10-28", "sources": [{"name": "財経新聞（Aoba-BBT 新聞稿）", "url": "https://www.zaikei.co.jp/releases/3647570/"}, {"name": "リセマム", "url": "https://resemom.jp/article/2026/10/06/87785.html"}]}, {"id": "2026-10-28-hk-01", "title": "教育局數據：私立中學五年增 56.3%（16→25 所），另類課程需求上升", "summary": "《南華早報》10 月 24 日報導，教育局數字顯示香港私立中學由 2021-22 年度 16 所增至 2025-26 年度 25 所，增幅 56.3%。教育局指經濟轉強及家長取向轉變帶動增長。", "details": "報導引述提供另類課程（非本地課程）的學校負責人指，在地緣政治因素下，香港大學的國際聲譽上升，令更多內地及海外學生考慮升讀本地大學，帶動相關中學需求。（SCMP 內文僅前段可見）", "region": "香港", "category": "招生與學生數變化", "published_date": "2026-10-24", "added_date": "2026-10-28", "sources": [{"name": "South China Morning Post", "url": "https://www.scmp.com/news/hong-kong/education/article/3371974/hong-kong-private-secondary-sector-expands-local-universities-reputation-grows"}]}, {"id": "2026-10-28-hk-02", "title": "教育局批准 2026/27 學年非公營學校加學費：國際學校平均 4%、私立 4.75%、直資 4.07%", "summary": "教育局批准直資、私立及國際學校 2026/27 學年加費申請，國際學校平均加幅 4%、私立學校 4.75%、直資學校 4.07%；62 宗國際學校申請中僅 1 宗仍在處理。另批准 492 間全日／長全日制幼稚園加費，每期學費中位數約 1,130 港元（按年增 40 港元）。", "details": "據 The Standard，國際學校中哈羅香港小學及中學部加 3.8%、Kellett 約 4.5%、漢基國際學校（ISF Academy）4.5%、耀中國際學校小學部約 5%、中學部 4.54%、香港猶太國際學校近 5%、神召會康樂中學（AOG St Hilary's College）小學部 5.8%。私立中學有 1 所獲准加逾 10%；直資學校 12 所小學及 37 所中學申請全數獲批。", "region": "香港", "category": "國際學校/IB/雙語校", "published_date": "2026-10-07", "added_date": "2026-10-28", "sources": [{"name": "The Standard", "url": "https://www.thestandard.com.hk/news/article/344792/Education-Bureau-approves-fee-increases-for-134-private-and-international-schools-kindergartens"}, {"name": "South China Morning Post", "url": "https://www.scmp.com/news/hong-kong/education/article/3369957/hong-kong-approves-average-fee-hikes-475-cent-non-public-schools"}, {"name": "Young Post Club", "url": "https://www.youngpostclub.com/spark/news/hong-kong/education/article/3369982/hong-kongs-non-public-schools-increase-tuition-fees-475-2026-27"}]}, {"id": "2026-10-28-hk-03", "title": "NLCS 香港校官方：仍在教育局註冊程序，目標 2027 年 9 月迎來首批學生（更正 10/27 卡片開校時間）", "summary": "NLCS International 官網公布 NLCS Hong Kong 舉行啟動活動，學校正進行教育局學校註冊程序，計劃於 2027 年 9 月迎來創校學生（須待批准），目前開放家長登記意向。此與本站 10/27 卡片「NLCS 香港校 9 月開校」說法不同，應以官方為準。", "details": "LivininHongKong（10 月 16 日）引述學校招聘文件指，初中小部（幼稚園至 Grade 5）預定 2027 年 8 月於黃大仙開辦、各約 500 學額，中學部校址為北角（未列開校日期），課程以英格蘭國家課程結合 IB PYP，並規劃 IB MYP 及 IBDP。合作夥伴為 HOEH Group。官方新聞稿發布日期未標示。", "region": "香港", "category": "國際學校/IB/雙語校", "published_date": "未確認", "added_date": "2026-10-28", "sources": [{"name": "NLCS International", "url": "https://www.nlcsinternational.co.uk/news/hong-kong-milestone/"}, {"name": "LivininHongKong.com", "url": "https://livininhongkong.com/news/218/top-british-ib-school-north-london-collegiate-to-open-in-hong-kong-in-august-2027-junior-campus-in-wong-tai-sin-senior-campus-in-north-point/"}]}, {"id": "2026-10-28-hk-04", "title": "教育局「English Sayings of Wisdom」（SOW）運動 2026/27 啟動，2025/26 年度近 5.2 萬名學生參與", "summary": "教育局副局長施俊輝於 10 月 10 日出席 SOW 運動 2025/26 頒獎禮暨 2026/27 啟動禮。2025/26 年度有來自 900 多所中小學、近 52,000 名學生參與各項英語活動及比賽。", "details": "2026/27 年度主題為「SOW the Reading Seed – The Spark Within, The Words Beyond」，設自我照顧、同理心、社區故事（配合香港特區成立 30 周年）、跨文化智慧四個副題，新增吉祥物 Sowy 及「SOW Vibrant Pearl Award」。教育局英文科網頁同時推介 English Explorer Portal 自主學習平台。", "region": "香港", "category": "政策制度", "published_date": "2026-10-16", "added_date": "2026-10-28", "sources": [{"name": "教育局 家長智醒站（Smart Parent Net）", "url": "https://www.parent.edu.hk/en/smart-parent-net/topics/article/202627sow"}, {"name": "教育局", "url": "https://www.edb.gov.hk/en/curriculum-development/kla/eng-edu/whats-new.html"}]}, {"id": "2026-10-28-hk-05", "title": "ESF 新開三間「直通」幼稚園：K2 畢業保證升讀指定小學，年增約 400 個 K1 學額", "summary": "英基學校協會（ESF）2026/27 學年在西沙、西九龍、康怡開設三間新幼稚園，各自連結指定小學並保證升讀。西沙及西九龍各 300 學額、康怡 200 學額；東涌幼稚園及西貢 Abacus 國際幼稚園則同時關閉。", "details": "據 British Schools Asia，西沙 ESF Renaissance College Kindergarten 直升 ESF 啟新書院；西九龍校連結 ESF 清水灣小學及堅尼地小學；康怡 ESF Quarry Bay School Kindergarten 連結 ESF 鰂魚涌小學及南島中學。報導估算每年淨增約 400 個英語幼兒教育 K1 學額，ESF 全體學生約 17,000 人。保證升讀以符合主流入學資格為前提。", "region": "香港", "category": "國際學校/IB/雙語校", "published_date": "2026-10-12", "added_date": "2026-10-28", "sources": [{"name": "British Schools Asia", "url": "https://britishschoolsasia.com/news/2026-10-12-esf-hong-kong-three-kindergartens-through-train-primary-2026/"}, {"name": "ESF Hong Kong", "url": "https://join-us.esf.edu.hk/new-esfrenaissancecollegekindergarten-announcement-faq/"}]}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var items=D.items, notes=D.day_notes||{}, trends=D.day_trends||{};
// 固定編號：依 added_date → published_date → id 由舊到新，篩選/排序不影響
items.slice().sort(function(a,b){return (a.added_date||'').localeCompare(b.added_date||'')||(a.published_date||'').localeCompare(b.published_date||'')||a.id.localeCompare(b.id);}).forEach(function(i,k){i._no=k+1;});
var CATS=["政策制度","國際學校/IB/雙語校","英語檢定","EdTech與教材","留學與海外研修","補習與民間教育市場","招生與學生數變化","業者動態","展會活動","投資合作"];
items.forEach(function(i){if(CATS.indexOf(i.category)<0)CATS.push(i.category);});
var sel=document.getElementById('fCat');
CATS.forEach(function(c){var o=document.createElement('option');o.textContent=c;sel.appendChild(o);});
document.getElementById('total').textContent=items.length;
document.getElementById('totJP').textContent=items.filter(function(i){return i.region==='日本'}).length;
document.getElementById('totHK').textContent=items.filter(function(i){return i.region==='香港'}).length;
var sortMode=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function trendsHTML(){
 var days={};items.forEach(function(i){var d=i.added_date;(days[d]=days[d]||{jp:0,hk:0,n:0});days[d].n++;if(i.region==='日本')days[d].jp++;if(i.region==='香港')days[d].hk++;});
 Object.keys(trends).forEach(function(d){days[d]=days[d]||{jp:0,hk:0,n:0};});
 var keys=Object.keys(days).sort().reverse();
 if(!keys.length)return '<p>尚無資料。</p>';
 return keys.map(function(d,k){var c=days[d],t=trends[d]||[];
  return '<details class="tday"'+(k===0?' open':'')+'><summary>'+d+'</summary><span class="cnt">新增 '+c.n+' 則：<span class="r" style="background:var(--berry)">日本 '+c.jp+'</span><span class="r" style="background:#9a6a1f">香港 '+c.hk+'</span></span>'+
  (t.length?'<ul>'+t.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p style="margin:4px 0">（當日無趨勢簡要）</p>')+
  '<a class="go" href="#d-'+d+'">→ 看當日情報</a></details>';}).join('');
}
function card(i){
 var src=(i.sources||[]).map(function(s){return '<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a></li>';}).join('');
 return '<article class="card"><div class="tags"><span class="no" title="第 '+i._no+' 則">#'+i._no+'</span><span class="tag r-'+esc(i.region)+'">'+esc(i.region)+'</span><span class="tag">'+esc(i.category)+'</span></div>'+
 '<h4>'+esc(i.title)+'</h4><div class="date">發布日期：'+esc(i.published_date||'未確認')+'</div><p>'+esc(i.summary)+'</p>'+
 '<div><b style="font-size:.85rem">相關網站：</b><ul class="src">'+src+'</ul></div>'+
 '<details><summary>展開詳情</summary><div>'+esc(i.details)+'</div></details></article>';
}
function render(){
 var r=document.getElementById('fRegion').value,c=sel.value,q=document.getElementById('q').value.trim().toLowerCase();
 var list=items.filter(function(i){
  if(r&&i.region!==r)return false; if(c&&i.category!==c)return false;
  if(q){var t=[i.title,i.summary,i.details,i.category,i.region].concat((i.sources||[]).map(function(s){return s.name})).join(' ').toLowerCase(); if(t.indexOf(q)<0)return false;}
  return true;});
 document.getElementById('shown').textContent='顯示 '+list.length+' / '+items.length+' 則';
 var out=document.getElementById('out');
 if(!list.length){out.innerHTML='<div class="empty">沒有符合條件的情報。</div>';return;}
 var byPub=function(a,b){return (b.published_date||'').localeCompare(a.published_date||'')||(b._no-a._no);};
 if(sortMode){
  list.sort(byPub);
  out.innerHTML='<section class="year"><h2>依發布日期排序<small>（不分更新日，新到舊）</small></h2><div class="grid">'+list.map(card).join('')+'</div></section>';
  return;
 }
 var years={};
 list.forEach(function(i){var y=i.added_date.slice(0,4),d=i.added_date;(years[y]=years[y]||{});(years[y][d]=years[y][d]||[]).push(i);});
 out.innerHTML=Object.keys(years).sort().reverse().map(function(y){
  var days=years[y],n=0;Object.keys(days).forEach(function(d){n+=days[d].length;});
  return '<section class="year"><h2>'+y+' 年<small>'+n+' 則</small></h2>'+Object.keys(days).sort().reverse().map(function(d){
   var note=notes[d]?'<span class="note">'+esc(notes[d])+'</span>':'';
   return '<section class="day" id="d-'+d+'"><h3>'+d+' 更新（'+days[d].length+' 則）'+note+'</h3><div class="grid">'+days[d].sort(byPub).map(card).join('')+'</div></section>';
  }).join('')+'</section>';
 }).join('');
}
['fRegion','fCat'].forEach(function(id){document.getElementById(id).addEventListener('change',render);});
document.getElementById('q').addEventListener('input',render);
var sb=document.getElementById('sortBtn');
sb.addEventListener('click',function(){sortMode=!sortMode;sb.textContent=sortMode?'改回按更新日分組':'依發布日期排序';sb.classList.toggle('alt',sortMode);render();});
document.getElementById('trendList').innerHTML=trendsHTML();
var nav=document.querySelector('.controls'),tr=document.getElementById('trends'),mq=window.matchMedia('(max-width:900px)');
function navh(){document.documentElement.style.setProperty('--navh',nav.offsetHeight+'px');document.documentElement.style.scrollPaddingTop=(nav.offsetHeight+10)+'px';}
function mode(){if(!mq.matches)tr.open=true;navh();}
tr.querySelector('summary').addEventListener('click',function(e){if(!mq.matches)e.preventDefault();});
window.addEventListener('resize',navh);
if(mq.addEventListener)mq.addEventListener('change',mode);
mode();
render();
})();
</script></body></html>
