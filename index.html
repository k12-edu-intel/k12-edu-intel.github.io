sc/edp/_uploads/2026/08/26data_03.pdf"}]}, {"id": "2026-10-27-jp-04", "title": "文科省令和 9 年度概算要求：英語教育強化事業要求 6 億日圓，約 200 所 AI 英語模範校", "summary": "文部科學省 8 月底公布令和 9 年度（2027 年度）概算要求，「小・中・高等學校を通じた英語教育強化事業」要求額 6 億日圓（前年度預算 2 億日圓），其中 4 億日圓用於「AI を活用したグローバル人材育成のための英語教育強化事業」。", "details": "該事業計劃指定約 200 所國公私立模範校，實證教師／ALT 指導與 AI 的有效組合，並委託民間企業擔任事務局（平台）。成果目標：中三達 CEFR A1（英檢 3 級程度）以上、高三達 A2（英檢準 2 級程度）以上的學生比例由令和 7 年度的 54.6%、52.4% 提升至令和 9 年度 60%；高三 B1（英檢 2 級程度）以上由 23.9% 提升至 30%。文科省另設「AI 英語教育」平台網站持續更新資訊（9 月 29 日有更新）。", "region": "日本", "category": "政策制度", "published_date": "2026-08-31", "added_date": "2026-10-27", "sources": [{"name": "文部科学省（初等中等教育局 概算要求主要事項 PDF）", "url": "https://www.mext.go.jp/content/20260831-mxt_kyoiku01-000051893-7.pdf"}, {"name": "文部科学省 令和9年度概算要求 資料一覧", "url": "https://www.mext.go.jp/a_menu/yosan/r01/1420668_00005.html"}, {"name": "文科省 AI英語教育プラットフォーム", "url": "https://ai-eigo.mext.go.jp/news/307/"}]}, {"id": "2026-10-27-jp-05", "title": "英國名校 Gordonstoun 日本分校（和歌山）2027 年 9 月開校，校舍公開、9 月起招生", "summary": "英國寄宿名校 Gordonstoun 的日本校「ゴードンストウン・ジャパン」位於和歌山市梅原，預計 2027 年 9 月開校，8 月 20 日向媒體公開改建中的校舍，2026 年 9 月起開始招生。", "details": "據產經新聞報導：首年招收小六至中三共 4 個年級、定員 200 人，最終規模約 700 人；全寄宿制，年費約 800 萬日圓；以各種學校身分設立，提供 A Level 課程，校長為 Natasha Dangerfield。另報導奈良縣在令和 8 年度預算中編列 1,700 萬日圓用於招攬國際學校，顯示關西地方政府積極爭取國際校進駐。", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-10-02", "added_date": "2026-10-27", "sources": [{"name": "産経新聞（2026-10-02）", "url": "https://www.sankei.com/article/20261002-KPMULB5X3ZNZROXWNNICXC5NDA/"}, {"name": "産経新聞（2026-08-26）", "url": "https://www.sankei.com/article/20260826-UUVZ3BLDBFMRBDRYDAPNP2DZOE/"}, {"name": "Gordonstoun Japan 官網", "url": "https://www.gordonstoun.jp/ja/"}]}, {"id": "2026-10-27-jp-06", "title": "RareJob 旗下 TISG 開設「東京國際學校南麻布幼稚園」", "summary": "RareJob（レアジョブ）子公司 TISG 於 8 月 24 日開設「東京インターナショナルスクール南麻布キンダーガーテン」，對象 2–5 歲，全英語環境，學年 8 月開始。", "details": "該園與學校法人東京國際學校（TIS）合作，畢業生可獲優先選考資格。這是線上英語會話業者向實體國際幼兒教育延伸的案例，反映東京都心高所得家庭對英語幼教的需求。", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-08-24", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（レアジョブ）", "url": "https://prtimes.jp/main/html/rd/p/000000296.000015102.html"}, {"name": "Tokyo International School KG 南麻布校", "url": "https://tokyois-kg.com/campus/minami-azabu/"}]}, {"id": "2026-10-27-jp-07", "title": "福岡國際學校新校舍啟用，學額擴至約 500 人", "summary": "Fukuoka International School 於 8 月 31 日為新翼校舍舉行剪綵。學校現有約 420 名學生、來自約 40 個國家，新校舍增加約 80 個學額，總容量約 500 人。", "details": "該校創立於 1972 年，是九州主要國際學校之一。擴建反映福岡因半導體等產業聚集帶動的外籍及歸國家庭教育需求。（報導標題稱 West Wing，文中提及 North Wing，以原文為準。）", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-09-01", "added_date": "2026-10-27", "sources": [{"name": "Fukuoka Now", "url": "https://www.fukuoka-now.com/en/fukuoka-international-school-west-wing-2026/"}]}, {"id": "2026-10-27-jp-08", "title": "行知學園公布籌設國際學校，主打日中英三語", "summary": "以中國留學生升學補習聞名的行知學園，8 月 27 日公布將在東京、大阪開設「行知学園インターナショナルスクール（Coach Academy International School）」並上線官網，主打日中英三語教育並結合升學補習機能。", "details": "開校日期在新聞稿中未明確，標記為「未確認」。此案顯示補習業者跨入國際學校市場，以及在日華人家庭對多語國際教育的需求。", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-08-27", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（行知学園）", "url": "https://prtimes.jp/main/html/rd/p/000000081.000059003.html"}, {"name": "Coach Academy International School 官網", "url": "https://www.coach-international.jp/"}]}, {"id": "2026-10-27-jp-09", "title": "Enuma Japan 推出生成式 AI 英語課程「トド英語アカデミー」", "summary": "Enuma Japan 9 月 16 日發布面向小四至中三的「トド英語アカデミー」，9 月 15 日舉行發表會。產品以 4 位 AI 學習教練與 2 種模式運作，運用生成式 AI 輔助學習。", "details": "首波推出 Level 1–3（Pre A1〜A1 High），Level 4–5 預計 2027 年推出；月費 3,100 日圓。屬低價位 AI 英語 EdTech 產品，與文科省 AI 英語政策方向一致。", "region": "日本", "category": "EdTech與教材", "published_date": "2026-09-16", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（Enuma Japan）", "url": "https://prtimes.jp/main/html/rd/p/000000036.000085949.html"}]}, {"id": "2026-10-27-jp-10", "title": "矢野經濟研究所：2025 年度日本教育產業規模 2 兆 8,705 億日圓，語言學校增長", "summary": "矢野經濟研究所 10 月 22 日發布調查，2025 年度教育產業（15 個領域）市場規模為 2 兆 8,705 億 1,000 萬日圓，年增 0.5%。語言學校・教室呈正成長，補習班・預備校則在地方停滯。", "details": "預測 2026 年度市場規模 2 兆 8,821 億 6,000 萬日圓（+0.4%），語言學校持平。報告亦指出大型業者下市、重組加速（可對照 Hulic 收購 Riso 教育一案）。日經轉載了新聞稿摘要。", "region": "日本", "category": "補習與民間教育市場", "published_date": "2026-10-22", "added_date": "2026-10-27", "sources": [{"name": "矢野経済研究所", "url": "https://www.yano.co.jp/press-release/show/press_id/4210"}, {"name": "日本経済新聞（プレスリリース転載）", "url": "https://www.nikkei.com/article/DGXZRSP714182_S6A021C2000000/"}]}, {"id": "2026-10-27-jp-11", "title": "學校基本調查速報：小學生 565 萬人、中學生 306 萬人皆創新低", "summary": "文科省 8 月 26 日公布令和 8 年度學校基本調查速報，小學生 565 萬 4,461 人（較前年減 15 萬 7,914 人）、中學生 306 萬 31 人，雙雙創歷史新低。", "details": "另一方面大學生達 300 萬 542 人，首度突破 300 萬。少子化持續壓縮 K12 補習及學校市場的生源，業者普遍轉向提高單價（英語、國際教育、個別指導）與併購整合。", "region": "日本", "category": "招生與學生數變化", "published_date": "2026-08-26", "added_date": "2026-10-27", "sources": [{"name": "文部科学省（速報 PDF）", "url": "https://www.mext.go.jp/content/20260826-mxt_chousa01-000050842_01.pdf"}, {"name": "教育新聞", "url": "https://www.kyobun.co.jp/article/2026082604"}]}, {"id": "2026-10-27-jp-12", "title": "Hulic 以 TOB 全面收購 Riso 教育集團（TOMAS、鐵綠會）", "summary": "不動產商 Hulic（ヒューリック）宣布以公開收購（TOB）將 Riso 教育集團（リソー教育，旗下有個別指導 TOMAS、鐵綠會等）納為全資子公司。收購價每股 295 日圓（溢價 41.15%），總額約 248 億 4,100 萬日圓。", "details": "收購期間為 10 月 14 日至 11 月 26 日；Hulic 原已持股 50.87%。此案是日本補習產業「上市公司下市＋重組」潮流的代表，值得追蹤 TOB 結果及後續與 Hulic 不動產（校舍）的協同。", "region": "日本", "category": "投資合作", "published_date": "2026-10-13", "added_date": "2026-10-27", "sources": [{"name": "M&A Online", "url": "https://maonline.jp/news/20261013d"}]}, {"id": "2026-10-27-jp-13", "title": "富士山雜誌服務集團收購 Shane English School 等英語・補習事業", "summary": "富士山マガジンサービス 9 月 7 日公告，子公司富士山アカデミアグループ於 10 月 1 日從 V-net HD（ブイネットHD）取得 Shane English School 事業及「Exam V Academy」補習事業。", "details": "Shane English School 事業 2026 年 3 月期營收 1 億 1,852.9 萬日圓；收購價未公開。相關事業的日文正式名稱以 IR 英文頁為準，日文名稱「未確認」。", "region": "日本", "category": "業者動態", "published_date": "2026-09-07", "added_date": "2026-10-27", "sources": [{"name": "Japan IR（富士山マガジンサービス IR）", "url": "https://japanir.jp/en/company/company-3138/ir/3138-20260907-01_wp_business_update/"}]}, {"id": "2026-10-27-jp-14", "title": "第 9 屆 EDIX 大阪 10 月 13–15 日舉行：改至 10 月預算編列期、移師 Grand Cube 大阪", "summary": "教育綜合展 EDIX 大阪於 10 月 13–15 日在 Grand Cube 大阪（大阪國際會議場）舉行，約 120 家企業參展，講座 30 場以上。本屆起改在 10 月（地方政府編列下年度預算時期）舉辦並更換會場。", "details": "EDIX 下一站為 EDIX 福岡，12 月 2–4 日於 Marine Messe 福岡舉行。對 EdTech 及英語教材業者而言，10 月展期更貼近教育委員會的採購決策週期。", "region": "日本", "category": "展會活動", "published_date": "2026-09-09", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（RX Japan）", "url": "https://prtimes.jp/main/html/rd/p/000002165.000026157.html"}, {"name": "EDIX 大阪 官網", "url": "https://www.edix-expo.jp/osaka/ja-jp.html"}, {"name": "EDIX 官網（各地展會）", "url": "https://www.edix-expo.jp/hub/ja-jp.html"}]}, {"id": "2026-10-27-jp-15", "title": "日本 IB 認定校・候補校達 283 所（截至 2026 年 9 月 30 日）", "summary": "文科省 IB 教育推進聯盟網站更新，截至 2026 年 9 月 30 日國內 IB 認定校・候補校（以課程計）共 283 所：PYP 認定 92／候補 42、MYP 47／13、DP 80／7、CP 1／1。", "details": "IB 機構 8 月 29 日在東京都立國際高中舉辦「DP Forum in 東京」，公告日本 IB World School（認定校）為 146 所，世界第 7 多，其中 80 所導入 DP，且導入 DP 的學校與學生數持續增加。統計口徑不同（以課程計 vs 以學校計），引用時須注意。頁面確切更新日期「未確認」，此處以資料基準日記錄。", "region": "日本", "category": "國際學校/IB/雙語校", "published_date": "2026-09-30", "added_date": "2026-10-27", "sources": [{"name": "文科省 IB教育推進コンソーシアム（認定校・候補校）", "url": "https://ibconsortium.mext.go.jp/about-ib/school/"}, {"name": "IB教育推進コンソーシアム（DP Forum 公告）", "url": "https://ibconsortium.mext.go.jp/news/news-6331/"}]}, {"id": "2026-10-27-jp-16", "title": "秋季中高生留學招生活躍：ECC 留學展、Riso 冬季短期遊學、各縣留學展", "summary": "ECC 海外留學中心 LET'S 於 10 月 17 日在大阪本社舉辦免費「秋の留学フェア」，10 所海外學校與機構參加，並設「中高生留學」選擇講座。Riso 教育集團子公司 Plus One 教育亦於 10 月 13 日起招募小中高生冬季帶隊短期遊學（矽谷名校體驗 8 日等）。", "details": "千葉縣等地方政府也舉辦中學・高中生留學展（千葉 11 月 7 日）。顯示疫後中高生短期海外研修需求延續，民間業者以「帶隊＋寄宿家庭」產品主打首次出國家庭。", "region": "日本", "category": "留學與海外研修", "published_date": "2026-10-07", "added_date": "2026-10-27", "sources": [{"name": "PR TIMES（ECC）", "url": "https://prtimes.jp/main/html/rd/p/000000220.000016929.html"}, {"name": "財経新聞（リソー教育グループ プレスリリース）", "url": "https://www.zaikei.co.jp/releases/3660577/"}, {"name": "千葉県（中学生・高校生留学フェア）", "url": "https://www.pref.chiba.lg.jp/kyouiku/seisaku/press/2026/r8-ryuugaku.html"}]}, {"id": "2026-10-27-hk-01", "title": "2026 施政報告教育重點：AI 學習平台、鼓勵公營學校合併、加強英語說話", "summary": "行政長官 9 月 16 日發表 2026 年施政報告，教育方面包括推出免費 AI 大模型學習資源平台、把 AI 教學助手擴展至更多科目，以及在 2026/27 學年推出「匯流·提升—卓越學校計劃」鼓勵公營中小學合併。", "details": "報告亦提出全港英語說話活動、推動初中學習其他語言、推行教師執業證書等。教育局局長 10 月 2 日向立法會事務委員會簡介相關措施，教育局亦提交了委員會文件。", "region": "香港", "category": "政策制度", "published_date": "2026-09-16", "added_date": "2026-10-27", "sources": [{"name": "2026 施政報告（第七章）", "url": "https://www.policyaddress.gov.hk/2026/en/chapter7.html"}, {"name": "政府新聞公報（施政報告全文）", "url": "https://www.info.gov.hk/gia/general/202609/16/P2026091600269.htm"}, {"name": "教育局（立法會事務委員會文件 PDF）", "url": "https://www.edb.gov.hk/attachment/en/about-edb/press/legco/policy-address/2026_panel%20paper(Eng).pdf"}, {"name": "政府新聞公報（局長立法會簡介）", "url": "https://www.info.gov.hk/gia/general/202610/02/P2026100200378p.htm"}]}, {"id": "2026-10-27-hk-02", "title": "直資學校擴展計劃：48 校獲批，持學生簽證非本地生增 13%", "summary": "教育局 10 月 21 日「局中人語」指出，直資學校擴展計劃已有 48 所直資學校獲批。9 月以自資模式入讀、持學生簽證的非本地學生有 170 人，按年增加 13%。", "details": "另有 7 所學校新取錄海外學生，教育局並推出學生宿舍實務守則。香港在本地學齡人口減少下，正把直資學校定位為吸引非本地學生的「國際教育樞紐」載體。", "region": "香港", "category": "招生與學生數變化", "published_date": "2026-10-21", "added_date": "2026-10-27", "sources": [{"name": "教育局 局中人語（2026-10-21）", "url": "https://www.edb.gov.hk/en/about-edb/press/insiderperspective/insiderperspective20261021.html"}, {"name": "教育局 直資學校擴展計劃", "url": "https://www.edb.gov.hk/en/edu-system/primary-secondary/applicable-to-primary-secondary/direct-subsidy-scheme/dss-expansion.html"}]}, {"id": "2026-10-27-hk-03", "title": "2026/27 小一縮班創紀錄：淨減 126 班，葵青區最嚴重", "summary": "2026/27 學年公營小學小一班數由 1,558 班減至 1,432 班，淨減 126 班（約 8%），創紀錄。葵青區受影響最大，有 15 所學校零班、約 60 所只開 1 班。", "details": "教育局局長蔡若蓮 9 月 5 日表示「保存學校」措施已用盡。HK01 根據《小學概覽》統計為淨減約 120 班，與 SCMP 數字略有差異，以各來源原文為準。SCMP 若需訂閱，可能僅標題可見。學齡人口下降直接衝擊小學、補習及幼教市場。", "region": "香港", "category": "招生與學生數變化", "published_date": "2026-09-01", "added_date": "2026-10-27", "sources": [{"name": "SCMP", "url": "https://www.scmp.com/news/hong-kong/education/article/3366024/worst-yet-come-hong-kong-schools-cut-record-126-primary-one-classes"}, {"name": "HK01", "url": "https://www.hk01.com/%E8%A6%AA%E5%AD%90/60386483/%E5%B0%8F%E5%AD%B8%E6%A6%82%E8%A6%BD2026-%E5%85%A8%E6%B8%AF%E6%B7%A8%E6%B8%9B120%E7%8F%AD%E5%B0%8F%E4%B8%80-%E8%91%B5%E9%9D%92%E6%88%90%E9%87%8D%E7%81%BD%E5%8D%80-60%E6%A0%A1%E5%83%85%E9%96%8B1%E7%8F%AD"}, {"name": "香港電台（中文）", "url": "https://news.rthk.hk/rthk/ch/component/k2/1868902-20260905.htm"}, {"name": "RTHK (English)", "url": "https://news.rthk.hk/rthk/en/component/k2/1868905-20260905.htm"}]}, {"id": "2026-10-27-hk-04", "title": "PISA 2025 結果：香港數學 522 分、「數碼世界中的學習」545 分", "summary": "政府 9 月 8 日公布 PISA 2025 香港結果：數學 522 分（國際平均 463）、科學 496 分（482）、母語閱讀 480 分（461），新增的「數碼世界中的學習」得 545 分（500）。", "details": "香港共有 6,445 名 15 歲學生、230 所學校參與。教育局宣布成立教育表現評估專家小組跟進分析。", "region": "香港", "category": "政策制度", "published_date": "2026-09-08", "added_date": "2026-10-27", "sources": [{"name": "政府新聞公報", "url": "https://www.info.gov.hk/gia/general/202609/08/P2026090800565.htm"}]}, {"id": "2026-10-27-hk-05", "title": "《幼稚園概覽 2026/27》發布：約 930 間幼稚園資料，含核准學費與非華語支援", "summary": "教育局 10 月 15 日發布 2026/27 學年《幼稚園概覽》，涵蓋約 930 間幼稚園及幼稚園暨幼兒中心的資料。", "details": "概覽列出各校 2026/27 學年核准學費，並設有非華語學童支援欄目，是家長選校及幼教業者觀察收費水平的主要公開資料。", "region": "香港", "category": "招生與學生數變化", "published_date": "2026-10-15", "added_date": "2026-10-27", "sources": [{"name": "news.gov.hk", "url": "https://www.news.gov.hk/eng/2026/10/20261015/20261015_115228_879.html"}, {"name": "教育局 新聞公報（2026年10月）", "url": "https://www.edb.gov.hk/tc/about-edb/press/press-releases/pressrelease_202610.html"}]}, {"id": "2026-10-27-hk-06", "title": "上海包玉剛學校香港校（YK Pao School Hong Kong）9 月開校", "summary": "YK Pao School Hong Kong 於 2026 年 9 月在油塘臨時校舍開校，首批約 100 名 P1–P3 學生，採中英雙語並走 IB PYP 至 MYP 路線。", "details": "位於九龍塘玫瑰街 4 號、樓面逾 8,000 平方米的永久校舍預計 2028 年 8 月啟用。上海名校來港辦學，反映高端國際雙語校仍在擴張，即便本地小一學額大幅收縮。", "region": "香港", "category": "國際學校/IB/雙語校", "published_date": "2026-09-04", "added_date": "2026-10-27", "sources": [{"name": "British Schools Asia", "url": "https://britishschoolsasia.com/news/2026-09-04-yk-pao-school-hong-kong-opens-2026/"}, {"name": "PR Newswire（2025 年開校公告）", "url": "https://www.prnewswire.com/apac/news-releases/pioneer-in-international-bilingual-education-yk-pao-school-hong-kong-to-open-in-september-2026-302585584.html"}]}, {"id": "2026-10-27-hk-07", "title": "英國 NLCS 香港校 9 月開校，學費約 23 萬港元", "summary": "英國 North London Collegiate School（NLCS）香港校於 2026 年 9 月開校，首年招收 Grade 1–4，與 HOEH Group 合作辦學。", "details": "年學費約 HK$230,000，為 NLCS International 的第 6 個海外校園。英國名校品牌持續在港設校（另見 Kellett、Shrewsbury 等擴建）。", "region": "香港", "category": "國際學校/IB/雙語校", "published_date": "2026-08-30", "added_date": "2026-10-27", "sources": [{"name": "British Schools Asia", "url": "https://britishschoolsasia.com/news/2026-08-30-nlcs-hong-kong-opens-british-school-september-2026/"}]}, {"id": "2026-10-27-hk-08", "title": "Kellett School 九龍灣 Sixth Form 中心正式啟用", "summary": "Kellett School 位於九龍灣 The Bay Hub 的 Sixth Form Centre 正式啟用，可容納 240 名 Year 12–13 學生，由英國駐港總領事 Brian Davidson 主持開幕。", "details": "同期香港多所國際學校擴建高年級學額（如 NAIS 紅磡 Sixth Form、Shrewsbury 新增 Y7 等，見 StarSchools 整理）。", "region": "香港", "category": "業者動態", "published_date": "2026-09-11", "added_date": "2026-10-27", "sources": [{"name": "Kellett School", "url": "https://www.kellettschool.com/news/2026-09-11/kellett-opens-new-sixth-form-centre"}, {"name": "British Schools Asia", "url": "https://britishschoolsasia.com/news/2026-08-21-kellett-school-hong-kong-sixth-form-bay-hub-2026/"}, {"name": "StarSchools（國際學校變動整理）", "url": "https://starschools.hk/en/schools/change/international"}]}, {"id": "2026-10-27-hk-09", "title": "語常會成立 30 周年：展示幼兒中英文發展計劃與 AI 語文教學", "summary": "語文教育及研究常務委員會（語常會）10 月 23 日舉行 30 周年誌慶典禮，主題「深耕三十載．語你譜新篇」，近 600 人出席。", "details": "署理教育局局長施俊輝、語常會主席陳黃麗娟出席。活動展示幼兒中英文發展計劃，並提及「人工智能在語文學與教的應用」國際高峰會，顯示「兩文三語」政策正結合 AI 推進。", "region": "香港", "category": "政策制度", "published_date": "2026-10-23", "added_date": "2026-10-27", "sources": [{"name": "政府新聞公報（中文）", "url": "https://www.info.gov.hk/gia/general/202610/23/P2026102300428.htm"}, {"name": "政府新聞公報（English）", "url": "https://www.info.gov.hk/gia/general/202610/23/P2026102300472.htm"}]}, {"id": "2026-10-27-hk-10", "title": "香港卓越獎學金計劃接受 2027/28 海外升學申請", "summary": "香港卓越獎學金計劃 10 月 13 日起至 12 月 31 日接受申請，資助學生 2027/28 學年到海外頂尖大學升學。", "details": "獎學金學費上限每年 30 萬港元，另設經濟審查助學金每年最高 20 萬港元；得獎者畢業後須回港工作至少 2 年。", "region": "香港", "category": "留學與海外研修", "published_date": "2026-10-13", "added_date": "2026-10-27", "sources": [{"name": "政府新聞公報", "url": "https://www.info.gov.hk/gia/general/202610/13/P2026101300146.htm"}, {"name": "香港卓越獎學金計劃", "url": "https://hkses.edb.gov.hk/en/"}]}, {"id": "2026-10-27-hk-11", "title": "The Standard 國際學校展 2026 落幕", "summary": "《英文虎報》（The Standard）主辦的 International Schools Fair 2026 已舉行（報導於 9 月 5 日刊出），設有生成式 AI、IB／AP／A-Level 等主題講座。", "details": "參展學校包括 ESF Discovery College、Harrow Little Lions、Malvern College Hong Kong 等。屬家長選校季的重要展會。", "region": "香港", "category": "展會活動", "published_date": "2026-09-05", "added_date": "2026-10-27", "sources": [{"name": "The Standard", "url": "https://www.thestandard.com.hk/news/article/341946/The-Standard-concludes-International-Schools-Fair-2026-on-high-note-as-families-gain-key-academic-insights"}]}, {"id": "2026-10-27-hk-12", "title": "德望學校畢業片指引「禁粵語」惹議，校長道歉、教育局促檢討", "summary": "德望學校（Good Hope School）畢業片指引被指要求影片不使用粵語，引發爭議，校長 Gary Harfitt 道歉。", "details": "教育局要求學校檢討相關規則。事件反映香港學校推動英語環境與本地語言認同之間的張力，屬語言政策相關的輿論風險案例。", "region": "香港", "category": "業者動態", "published_date": "2026-09-20", "added_date": "2026-10-27", "sources": [{"name": "The Standard", "url": "https://www.thestandard.com.hk/news/article/343282/Good-Hope-School-apologizes-for-circulating-graduation-video-guideline-suggests-banning-Cantonese"}, {"name": "SCMP", "url": "https://www.scmp.com/news/hong-kong/society/article/3368157/hong-kong-school-told-review-rules-after-outrage-over-cantonese-ban-videos"}]}, {"id": "2026-10-27-hk-13", "title": "「AI for All」全民 AI 計劃：數碼港開放日展示教育 AI 方案", "summary": "據《中國日報》香港版 10 月 23 日報導，政府「AI for All」全民 AI 計劃（2026-27 年度預算 5,000 萬港元，由科學園、生產力局、數碼港執行）持續推進。", "details": "10 月 22 日數碼港開放日上，iFlytek（科大訊飛）、Canpanion 等企業展示教育 AI 方案。結合施政報告的 AI 學習平台，香港校園 AI 教材與平台採購可望增加。", "region": "香港", "category": "EdTech與教材", "published_date": "2026-10-23", "added_date": "2026-10-27", "sources": [{"name": "China Daily Hong Kong", "url": "https://www.chinadailyhk.com/hk/article/641555"}]}, {"id": "2026-10-27-hk-14", "title": "IELTS 在港全面轉為電腦考試，不再提供紙筆試", "summary": "British Council／IDP 自 2026 年 7 月起在香港不再提供紙筆 IELTS，改為電腦考試。", "details": "現行考試費：Academic／General Training HK$2,900，UKVI 版本 HK$3,100。正式公告日期「未確認」，此處以 British Council 現行資料頁為據，發布日期以實施日 2026-07-01 記錄。", "region": "香港", "category": "英語檢定", "published_date": "2026-07-01", "added_date": "2026-10-27", "sources": [{"name": "British Council Hong Kong（IELTS 日期與費用）", "url": "https://www.britishcouncil.hk/en/exam/ielts/dates-fees-locations"}]}, {"id": "2026-10-27-hk-15", "title": "補習平台報告：SEN 補習需求一年增 58%", "summary": "補習配對平台尋補（Tutor Circle）8 月發表 2026 年度報告，SEN（特殊教育需要）補習請求由 2024 年 85 宗增至 2025 年 135 宗，增幅 58%，並附上門補習收費參考。", "details": "另一平台 TutorZone 9 月 19 日發表香港補習搜尋趨勢報告。兩者均為業者自身平台數據，樣本有限，僅供參考趨勢。", "region": "香港", "category": "補習與民間教育市場", "published_date": "2026-08-13", "added_date": "2026-10-27", "sources": [{"name": "經濟日報（聯合新聞網轉載）", "url": "https://money.udn.com/money/story/123828/9688910"}, {"name": "TutorZone 搜尋趨勢報告", "url": "https://www.tutorzone.com.hk/hk-tutoring-search-trend-report-2026/"}]}, {"id": "2026-10-27-hk-16", "title": "香港體育學院與維多利亞上海學院簽 MOU：精英運動員全額獎學金與彈性 IB", "summary": "香港體育學院（HKSI）10 月 12 日與維多利亞上海學院（VSA）簽署合作備忘錄，VSA 成為其第三所夥伴學校。", "details": "合作提供全額運動獎學金，IB 文憑課程可延長至三年完成，2027/28 學年入學，2027 年初開放申請。屬國際課程學校與公共體育機構的合作案例。", "region": "香港", "category": "投資合作", "published_date": "2026-10-12", "added_date": "2026-10-27", "sources": [{"name": "香港體育學院", "url": "https://www.hksi.org.hk/news/hong-kong-sports-institute-and-victoria-shanghai-academy-sign-mou-to-empower-hong-kong-s-student-athletes-delivering-an-unparalleled-world-class-and-diverse-educational-experience-with-full-scholarships-and-flexible-ib-pathways/"}]}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var items=D.items, notes=D.day_notes||{};
var CATS=["政策制度","國際學校/IB/雙語校","英語檢定","EdTech與教材","留學與海外研修","補習與民間教育市場","招生與學生數變化","業者動態","展會活動","投資合作"];
items.forEach(function(i){if(CATS.indexOf(i.category)<0)CATS.push(i.category);});
var sel=document.getElementById('fCat');
CATS.forEach(function(c){var o=document.createElement('option');o.textContent=c;sel.appendChild(o);});
document.getElementById('total').textContent=items.length;
document.getElementById('totJP').textContent=items.filter(function(i){return i.region==='日本'}).length;
document.getElementById('totHK').textContent=items.filter(function(i){return i.region==='香港'}).length;
var sortMode=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function card(i){
 var src=(i.sources||[]).map(function(s){return '<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a></li>';}).join('');
 return '<article class="card"><div class="tags"><span class="tag r-'+esc(i.region)+'">'+esc(i.region)+'</span><span class="tag">'+esc(i.category)+'</span></div>'+
 '<h4>'+esc(i.title)+'</h4><div class="date">發布日期：'+esc(i.published_date||'未確認')+'</div><p>'+esc(i.summary)+'</p>'+
 '<div><b style="font-size:.85rem">相關網站：</b><ul class="src">'+src+'</ul></div>'+
 '<details><summary>展開詳情</summary><div>'+esc(i.details)+'</div></details></article>';
}
function render(){
 var r=document.getElementById('fRegion').value,c=sel.value,q=document.getElementById('q').value.trim().toLowerCase();
 var list=items.filter(function(i){
  if(r&&i.region!==r)return false; if(c&&i.category!==c)return false;
  if(q){var t=[i.title,i.summary,i.details,i.category,i.region].concat((i.sources||[]).map(function(s){return s.name})).join(' ').toLowerCase(); if(t.indexOf(q)<0)return false;}
  return true;});
 document.getElementById('shown').textContent='顯示 '+list.length+' / '+items.length+' 則';
 var out=document.getElementById('out');
 if(!list.length){out.innerHTML='<div class="empty">沒有符合條件的情報。</div>';return;}
 var byPub=function(a,b){return (b.published_date||'').localeCompare(a.published_date||'')||a.id.localeCompare(b.id);};
 if(sortMode){
  list.sort(byPub);
  out.innerHTML='<section class="year"><h2>依發布日期排序<small>（不分更新日，新到舊）</small></h2><div class="grid">'+list.map(card).join('')+'</div></section>';
  return;
 }
 var years={};
 list.forEach(function(i){var y=i.added_date.slice(0,4),d=i.added_date;(years[y]=years[y]||{});(years[y][d]=years[y][d]||[]).push(i);});
 out.innerHTML=Object.keys(years).sort().reverse().map(function(y){
  var days=years[y],n=0;Object.keys(days).forEach(function(d){n+=days[d].length;});
  return '<section class="year"><h2>'+y+' 年<small>'+n+' 則</small></h2>'+Object.keys(days).sort().reverse().map(function(d){
   var note=notes[d]?'<span class="note">'+esc(notes[d])+'</span>':'';
   return '<section class="day"><h3>'+d+' 更新（'+days[d].length+' 則）'+note+'</h3><div class="grid">'+days[d].sort(byPub).map(card).join('')+'</div></section>';
  }).join('')+'</section>';
 }).join('');
}
['fRegion','fCat'].forEach(function(id){document.getElementById(id).addEventListener('change',render);});
document.getElementById('q').addEventListener('input',render);
var sb=document.getElementById('sortBtn');
sb.addEventListener('click',function(){sortMode=!sortMode;sb.textContent=sortMode?'改回按更新日分組':'依發布日期排序';sb.classList.toggle('alt',sortMode);render();});
render();
})();
</script></body></html>
